<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sky Patrol · 像素飞机</title>
    <style>
      :root {
        --ink: #05070f;
        --panel: #0a1026;
        --line: #1b2a55;
        --cyan: #7ef9ff;
        --amber: #ffd166;
        --red: #ff5a5f;
        --text: #e8f0ff;
        --muted: #8fb0ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Courier New", ui-monospace, monospace;
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        position: relative;
        width: min(96vw, calc(96vh * 16 / 9));
        aspect-ratio: 16 / 9;
        background: var(--panel);
        box-shadow:
          0 0 0 2px var(--line),
          0 0 0 6px #05070f,
          0 24px 60px rgba(0, 0, 0, 0.7);
        overflow: hidden;
      }

      #stage {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #lens {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.24) 0 2px,
          transparent 2px 4px
        );
        opacity: 0.3;
      }

      #hud {
        position: absolute;
        inset: 0;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: clamp(10px, 1.5vw, 15px);
        text-shadow: 0 2px 0 #000;
      }

      .hud-group {
        display: flex;
        gap: clamp(14px, 2.4vw, 32px);
      }

      .hud-item {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .hud-label {
        font-size: 0.72em;
        color: var(--muted);
      }

      .hud-value {
        color: var(--amber);
        font-weight: 700;
        font-size: 1.3em;
        line-height: 1;
      }

      #hp {
        color: var(--red);
        letter-spacing: 0.18em;
      }

      #power {
        color: var(--muted);
        transition:
          color 0.2s ease,
          text-shadow 0.2s ease;
      }

      #power.on {
        color: var(--cyan);
        text-shadow:
          0 0 8px rgba(126, 249, 255, 0.9),
          0 0 18px rgba(126, 249, 255, 0.45);
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(8px, 1.6vh, 16px);
        padding: 24px;
        text-align: center;
        background: radial-gradient(
          circle at 50% 44%,
          rgba(10, 20, 50, 0.4),
          rgba(5, 7, 15, 0.9) 72%
        );
        transition: opacity 0.18s ease;
      }

      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .eyebrow {
        font-size: clamp(9px, 1.2vw, 13px);
        letter-spacing: 0.42em;
        color: var(--cyan);
        opacity: 0.8;
      }

      #title {
        margin: 0;
        font-size: clamp(30px, 6.4vw, 76px);
        letter-spacing: 0.14em;
        color: #fff;
        text-shadow:
          0 0 0 #000,
          4px 4px 0 #1b2a55,
          0 0 28px rgba(126, 249, 255, 0.45);
      }

      #subtitle {
        margin: 0;
        max-width: 44ch;
        font-size: clamp(11px, 1.5vw, 16px);
        line-height: 1.7;
        color: #bcd0ff;
      }

      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        justify-content: center;
        margin-top: 4px;
        font-size: clamp(9px, 1.2vw, 13px);
        color: var(--muted);
      }

      #controls span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      kbd {
        display: inline-block;
        min-width: 2.1em;
        padding: 3px 6px;
        border: 1px solid #36508f;
        border-bottom-width: 3px;
        border-radius: 3px;
        background: #101a36;
        color: #dce8ff;
        font: inherit;
        font-size: 0.92em;
        text-align: center;
      }

      #actionBtn {
        margin-top: 6px;
        padding: 12px 30px;
        border: 2px solid var(--cyan);
        background: #0d1b3a;
        color: var(--cyan);
        font: inherit;
        font-size: clamp(11px, 1.5vw, 16px);
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 4px 4px 0 #000;
        transition:
          transform 0.06s ease,
          background 0.12s ease,
          box-shadow 0.06s ease;
      }

      #actionBtn:hover {
        background: #14264f;
      }

      #actionBtn:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 #000;
      }

      #hint {
        position: absolute;
        bottom: 9px;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
        font-size: clamp(8px, 1.15vw, 12px);
        letter-spacing: 0.1em;
        color: #6c82b6;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <canvas id="lens"></canvas>
      <div id="scanlines"></div>

      <div id="hud">
        <div class="hud-group">
          <div class="hud-item">
            <span class="hud-label">Score</span>
            <span class="hud-value" id="score">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Best</span>
            <span class="hud-value" id="best">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Firepower</span>
            <span class="hud-value" id="power">—</span>
          </div>
        </div>
        <div class="hud-group">
          <div class="hud-item">
            <span class="hud-label">Hull</span>
            <span class="hud-value" id="hp">♥♥♥♥♥</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Wave</span>
            <span class="hud-value" id="wave">1</span>
          </div>
        </div>
      </div>

      <div id="overlay">
        <div class="eyebrow">2D Pixel Flight Demo</div>
        <h1 id="title">Sky Patrol</h1>
        <p id="subtitle">击落热气球，收集能量水晶，别让它们撞上你的飞机。</p>
        <div id="controls">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
          <span><kbd>Space</kbd> 射击</span>
          <span><kbd>R</kbd> 重开</span>
          <span><kbd>P</kbd> 自动演示</span>
        </div>
        <button id="actionBtn" type="button">开始飞行</button>
      </div>

      <div id="hint">WASD / 方向键 移动 · 空格或按住鼠标 射击 · 每 200 分强化火力 8 秒 · R 重新开始 · P 自动演示</div>
    </div>

    <script src="./node_modules/planck/dist/planck.js"></script>
    <script src="./node_modules/stage-js/dist/stage.umd.cjs"></script>
    <script>
      function bootFail(message) {
        const subtitle = document.getElementById("subtitle");
        const button = document.getElementById("actionBtn");
        if (subtitle) subtitle.textContent = message;
        if (button) {
          button.disabled = true;
          button.textContent = "启动失败";
        }
      }

      if (!window.planck || !window.Stage) {
        bootFail("引擎库加载失败：请先在项目目录执行 npm install，再打开本文件。");
      } else {
        window.addEventListener(
          "error",
          (event) => {
            if (!event.message) return;
            bootFail(`启动失败：${event.message}（按 Ctrl+F5 强制刷新后再试）`);
          },
          { once: true },
        );

        const script = document.createElement("script");
        if (location.protocol === "file:") {
          script.src = "./dist/sky-patrol.js";
          script.onerror = () => {
            bootFail("找不到 ./dist/sky-patrol.js：请在项目目录执行 npm install && npm run build，然后重新打开本文件。");
          };
        } else {
          script.type = "module";
          script.src = "./src/main.js";
        }
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
